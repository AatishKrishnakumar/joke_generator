<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke Generator</title>
    
<body style="background-color: rgb(224, 206, 182);font-family: Arial, sans-serif;color: black;margin: 0; padding: 30px;">
    <h1 style="text-align: center;margin-bottom: 30px;">Joke Generator</h1>
    <div style="max-width: 600px; margin: 0 auto 40px;padding: 25px; background: white;border: 5px solid black; border-radius: 50px;" >
        
        <h3 id="setup" style="font-size: 20px;margin-bottom: 15px;"></h3>
        <h3 id="punchline" style="font-size: 15px; color: red; margin-bottom: 20px;"></h3>

    <div style="display: flex; gap: 20px;justify-content: flex-end; flex-wrap: wrap;margin-top: 20px;">
      <button onclick="getData()"style="padding:11px 18px; background:black; color:white; border:none; border-radius:10px; cursor:pointer;">Generate New</button>
      <button onclick="addTofav()"style="padding:11px 18px; background:green; color:white; border:none; border-radius:10px; cursor:pointer;">Add to Fav</button>
    </div>
    </div>
    <h1 style="text-align:center; font-size:25px; margin-bottom:20px;">Favourites</h1>
    <table border="1"style="width:100%; border-collapse:collapse;background:white;border-radius:12px;text-align:left;">
        <thead>
            <tr style="background:black;color: white;">
                <th>id</th>
                <th>type</th>
                <th>setup</th>
                <th>punchline</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="result">
            
        </tbody>
    </table>
</head>
</body>
<script>
    let apiRes = null
    let favourites = JSON.parse(localStorage.getItem('data')) || []
    const getData = async ()=>{
        try {
            apiRes = await fetch('https://official-joke-api.appspot.com/random_joke')
            apiRes = await apiRes.json()
            console.log(apiRes);
            
            document.querySelector('#setup').innerText = apiRes.setup
            document.querySelector('#punchline').innerText = apiRes.punchline


        } catch (error) {
            console.log(error)
            alert('error occured')
        }
    }
    getData()

    const addTofav=()=>{
      favourites.unshift(apiRes);
      let jsonData = JSON.stringify(favourites)
      localStorage.setItem('data',jsonData)
      showFavourites()
      alert('added to favourites')


    }
    const showFavourites = ()=>{
        let resultEl = document.querySelector('#result')
        resultEl.innerHTML=""

        favourites.map((eachData)=>(
            resultEl.innerHTML += `<tr>
                <td>${eachData.id}</td>
                <td>${eachData.type}</td>
                <td>${eachData.setup}</td>
                <td>${eachData.punchline}</td>
                <td><button onclick="deleteFav(${eachData.id})"style="padding:8px 12px; background:orangered; color:white; border:none; border-radius:5px;">Delete</button></td>

            </tr>`),
        )
    }
    showFavourites()

    const deleteFav = (dId) => {
            favourites = favourites.filter(eachData => eachData.id !== dId);
            localStorage.setItem('data', JSON.stringify(favourites));
            showFavourites();
        };

        showFavourites();
        getData();
</script>
</html>
